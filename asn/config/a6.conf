frr defaults datacenter
!
interface Ethernet1-1
  ip address 10.0.10.0/31
!
interface Ethernet1-2
  ip address 10.0.11.0/31
!
interface Ethernet1-3
  ip address 10.0.26.0/31
!
interface Ethernet1-4
  ip address 10.0.27.0/31
!
router bgp 202
  bgp router-id 1.1.1.1
  bgp bestpath as-path multipath-relax
  neighbor 10.0.10.1 remote-as 65001
  neighbor 10.0.11.1 remote-as 65001
  neighbor 10.0.26.1 remote-as 302
  neighbor 10.0.27.1 remote-as 302
  !
  address-family ipv4 unicast
    neighbor 10.0.10.1 activate
    neighbor 10.0.10.1 allowas-in 2
    neighbor 10.0.10.1 activate
    neighbor 10.0.10.1 allowas-in 2
    neighbor 10.0.11.1 activate
    neighbor 10.0.11.1 allowas-in 2
    neighbor 10.0.11.1 activate
    neighbor 10.0.11.1 allowas-in 2
    neighbor 10.0.26.1 activate
    neighbor 10.0.26.1 allowas-in 2
    neighbor 10.0.26.1 activate
    neighbor 10.0.26.1 allowas-in 2
    neighbor 10.0.27.1 activate
    neighbor 10.0.27.1 allowas-in 2
    neighbor 10.0.27.1 activate
    neighbor 10.0.27.1 allowas-in 2
    maximum-paths 64
  exit-address-family
!

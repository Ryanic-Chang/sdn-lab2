frr defaults datacenter
!
interface Ethernet1-1
  ip address 10.0.20.1/31
!
interface Ethernet1-2
  ip address 10.0.22.1/31
!
interface Ethernet1-3
  ip address 172.16.5.1/24
!
interface Ethernet1-4
  ip address 172.16.6.1/24
!
router bgp 301
  bgp router-id 1.1.1.1
  bgp bestpath as-path multipath-relax
  neighbor 10.0.20.0 remote-as 201
  neighbor 10.0.22.0 remote-as 201
  !
  address-family ipv4 unicast
    neighbor 10.0.20.0 activate
    neighbor 10.0.20.0 allowas-in 2
    neighbor 10.0.20.0 activate
    neighbor 10.0.20.0 allowas-in 2
    neighbor 10.0.22.0 activate
    neighbor 10.0.22.0 allowas-in 2
    neighbor 10.0.22.0 activate
    neighbor 10.0.22.0 allowas-in 2
    network 172.16.5.0/24
    network 172.16.6.0/24
    maximum-paths 64
  exit-address-family
!

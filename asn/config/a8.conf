frr defaults datacenter
!
interface Ethernet1-1
  ip address 10.0.14.0/31
!
interface Ethernet1-2
  ip address 10.0.15.0/31
!
interface Ethernet1-3
  ip address 10.0.30.0/31
!
interface Ethernet1-4
  ip address 10.0.31.0/31
!
router bgp 203
  bgp router-id 1.1.1.1
  bgp bestpath as-path multipath-relax
  neighbor 10.0.14.1 remote-as 65001
  neighbor 10.0.15.1 remote-as 65001
  neighbor 10.0.30.1 remote-as 303
  neighbor 10.0.31.1 remote-as 303
  !
  address-family ipv4 unicast
    neighbor 10.0.14.1 activate
    neighbor 10.0.14.1 allowas-in 2
    neighbor 10.0.14.1 activate
    neighbor 10.0.14.1 allowas-in 2
    neighbor 10.0.15.1 activate
    neighbor 10.0.15.1 allowas-in 2
    neighbor 10.0.15.1 activate
    neighbor 10.0.15.1 allowas-in 2
    neighbor 10.0.30.1 activate
    neighbor 10.0.30.1 allowas-in 2
    neighbor 10.0.30.1 activate
    neighbor 10.0.30.1 allowas-in 2
    neighbor 10.0.31.1 activate
    neighbor 10.0.31.1 allowas-in 2
    neighbor 10.0.31.1 activate
    neighbor 10.0.31.1 allowas-in 2
    maximum-paths 64
  exit-address-family
!

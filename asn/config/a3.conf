frr defaults datacenter
!
interface Ethernet1-1
  ip address 10.0.4.0/31
!
interface Ethernet1-2
  ip address 10.0.5.0/31
!
interface Ethernet1-3
  ip address 10.0.20.0/31
!
interface Ethernet1-4
  ip address 10.0.21.0/31
!
router bgp 201
  bgp router-id 1.1.1.1
  bgp bestpath as-path multipath-relax
  neighbor 10.0.4.1 remote-as 65001
  neighbor 10.0.5.1 remote-as 65001
  neighbor 10.0.20.1 remote-as 301
  neighbor 10.0.21.1 remote-as 301
  !
  address-family ipv4 unicast
    neighbor 10.0.4.1 activate
    neighbor 10.0.4.1 allowas-in 2
    neighbor 10.0.4.1 activate
    neighbor 10.0.4.1 allowas-in 2
    neighbor 10.0.5.1 activate
    neighbor 10.0.5.1 allowas-in 2
    neighbor 10.0.5.1 activate
    neighbor 10.0.5.1 allowas-in 2
    neighbor 10.0.20.1 activate
    neighbor 10.0.20.1 allowas-in 2
    neighbor 10.0.20.1 activate
    neighbor 10.0.20.1 allowas-in 2
    neighbor 10.0.21.1 activate
    neighbor 10.0.21.1 allowas-in 2
    neighbor 10.0.21.1 activate
    neighbor 10.0.21.1 allowas-in 2
    maximum-paths 64
  exit-address-family
!

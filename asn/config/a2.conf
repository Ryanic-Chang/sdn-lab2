frr defaults datacenter
!
interface Ethernet1-1
  ip address 10.0.2.0/31
!
interface Ethernet1-2
  ip address 10.0.3.0/31
!
interface Ethernet1-3
  ip address 10.0.18.0/31
!
interface Ethernet1-4
  ip address 10.0.19.0/31
!
router bgp 200
  bgp router-id 1.1.1.1
  bgp bestpath as-path multipath-relax
  neighbor 10.0.2.1 remote-as 65001
  neighbor 10.0.3.1 remote-as 65001
  neighbor 10.0.18.1 remote-as 300
  neighbor 10.0.19.1 remote-as 300
  !
  address-family ipv4 unicast
    neighbor 10.0.2.1 activate
    neighbor 10.0.2.1 allowas-in 2
    neighbor 10.0.2.1 activate
    neighbor 10.0.2.1 allowas-in 2
    neighbor 10.0.3.1 activate
    neighbor 10.0.3.1 allowas-in 2
    neighbor 10.0.3.1 activate
    neighbor 10.0.3.1 allowas-in 2
    neighbor 10.0.18.1 activate
    neighbor 10.0.18.1 allowas-in 2
    neighbor 10.0.18.1 activate
    neighbor 10.0.18.1 allowas-in 2
    neighbor 10.0.19.1 activate
    neighbor 10.0.19.1 allowas-in 2
    neighbor 10.0.19.1 activate
    neighbor 10.0.19.1 allowas-in 2
    maximum-paths 64
  exit-address-family
!

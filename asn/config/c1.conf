frr defaults datacenter
!
interface Ethernet1-1
  ip address 10.0.0.1/31
!
interface Ethernet1-2
  ip address 10.0.4.1/31
!
interface Ethernet1-3
  ip address 10.0.8.1/31
!
interface Ethernet1-4
  ip address 10.0.12.1/31
!
router bgp 65001
  bgp router-id 1.1.1.1
  bgp bestpath as-path multipath-relax
  neighbor 10.0.0.0 remote-as 200
  neighbor 10.0.4.0 remote-as 201
  neighbor 10.0.8.0 remote-as 202
  neighbor 10.0.12.0 remote-as 203
  !
  address-family ipv4 unicast
    neighbor 10.0.0.0 activate
    neighbor 10.0.0.0 allowas-in 2
    neighbor 10.0.0.0 activate
    neighbor 10.0.0.0 allowas-in 2
    neighbor 10.0.4.0 activate
    neighbor 10.0.4.0 allowas-in 2
    neighbor 10.0.4.0 activate
    neighbor 10.0.4.0 allowas-in 2
    neighbor 10.0.8.0 activate
    neighbor 10.0.8.0 allowas-in 2
    neighbor 10.0.8.0 activate
    neighbor 10.0.8.0 allowas-in 2
    neighbor 10.0.12.0 activate
    neighbor 10.0.12.0 allowas-in 2
    neighbor 10.0.12.0 activate
    neighbor 10.0.12.0 allowas-in 2
    maximum-paths 64
  exit-address-family
!

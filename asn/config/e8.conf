frr defaults datacenter
!
interface Ethernet1-1
  ip address 10.0.29.1/31
!
interface Ethernet1-2
  ip address 10.0.31.1/31
!
interface Ethernet1-3
  ip address 172.16.15.1/24
!
interface Ethernet1-4
  ip address 172.16.16.1/24
!
router bgp 303
  bgp router-id 1.1.1.1
  bgp bestpath as-path multipath-relax
  neighbor 10.0.29.0 remote-as 203
  neighbor 10.0.31.0 remote-as 203
  !
  address-family ipv4 unicast
    neighbor 10.0.29.0 activate
    neighbor 10.0.29.0 allowas-in 2
    neighbor 10.0.29.0 activate
    neighbor 10.0.29.0 allowas-in 2
    neighbor 10.0.31.0 activate
    neighbor 10.0.31.0 allowas-in 2
    neighbor 10.0.31.0 activate
    neighbor 10.0.31.0 allowas-in 2
    network 172.16.15.0/24
    network 172.16.16.0/24
    maximum-paths 64
  exit-address-family
!

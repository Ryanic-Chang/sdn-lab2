frr defaults datacenter
!
interface Ethernet1-1
  ip address 10.0.25.1/31
!
interface Ethernet1-2
  ip address 10.0.27.1/31
!
interface Ethernet1-3
  ip address 172.16.11.1/24
!
interface Ethernet1-4
  ip address 172.16.12.1/24
!
router bgp 302
  bgp router-id 1.1.1.1
  bgp bestpath as-path multipath-relax
  neighbor 10.0.25.0 remote-as 202
  neighbor 10.0.27.0 remote-as 202
  !
  address-family ipv4 unicast
    neighbor 10.0.25.0 activate
    neighbor 10.0.25.0 allowas-in 2
    neighbor 10.0.25.0 activate
    neighbor 10.0.25.0 allowas-in 2
    neighbor 10.0.27.0 activate
    neighbor 10.0.27.0 allowas-in 2
    neighbor 10.0.27.0 activate
    neighbor 10.0.27.0 allowas-in 2
    network 172.16.11.0/24
    network 172.16.12.0/24
    maximum-paths 64
  exit-address-family
!

frr defaults datacenter
!
interface Ethernet1-1
  ip address 10.0.6.0/31
!
interface Ethernet1-2
  ip address 10.0.7.0/31
!
interface Ethernet1-3
  ip address 10.0.22.0/31
!
interface Ethernet1-4
  ip address 10.0.23.0/31
!
router bgp 201
  bgp router-id 1.1.1.1
  bgp bestpath as-path multipath-relax
  neighbor 10.0.6.1 remote-as 65001
  neighbor 10.0.7.1 remote-as 65001
  neighbor 10.0.22.1 remote-as 301
  neighbor 10.0.23.1 remote-as 301
  !
  address-family ipv4 unicast
    neighbor 10.0.6.1 activate
    neighbor 10.0.6.1 allowas-in 2
    neighbor 10.0.6.1 activate
    neighbor 10.0.6.1 allowas-in 2
    neighbor 10.0.7.1 activate
    neighbor 10.0.7.1 allowas-in 2
    neighbor 10.0.7.1 activate
    neighbor 10.0.7.1 allowas-in 2
    neighbor 10.0.22.1 activate
    neighbor 10.0.22.1 allowas-in 2
    neighbor 10.0.22.1 activate
    neighbor 10.0.22.1 allowas-in 2
    neighbor 10.0.23.1 activate
    neighbor 10.0.23.1 allowas-in 2
    neighbor 10.0.23.1 activate
    neighbor 10.0.23.1 allowas-in 2
    maximum-paths 64
  exit-address-family
!

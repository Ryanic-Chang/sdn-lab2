frr defaults datacenter
!
interface Ethernet1-1
  ip address 10.0.6.0/31
!
interface Ethernet1-2
  ip address 10.0.7.0/31
!
interface Ethernet1-3
  ip address 10.0.22.0/31
!
interface Ethernet1-4
  ip address 10.0.23.0/31
!
router bgp 203
  bgp router-id a4
  bgp bestpath as-path multipath-relax
  neighbor 10.0.6.1 remote-as 102
  neighbor 10.0.7.1 remote-as 103
  neighbor 10.0.22.1 remote-as 302
  neighbor 10.0.23.1 remote-as 303
!

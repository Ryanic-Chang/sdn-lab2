frr defaults datacenter
!
interface Ethernet1-1
  ip address 10.0.10.0/31
!
interface Ethernet1-2
  ip address 10.0.11.0/31
!
interface Ethernet1-3
  ip address 10.0.26.0/31
!
interface Ethernet1-4
  ip address 10.0.27.0/31
!
router bgp 205
  bgp router-id a6
  bgp bestpath as-path multipath-relax
  neighbor 10.0.10.1 remote-as 102
  neighbor 10.0.11.1 remote-as 103
  neighbor 10.0.26.1 remote-as 304
  neighbor 10.0.27.1 remote-as 305
!
